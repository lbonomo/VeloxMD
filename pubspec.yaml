name: veloxmd
description: A fast Markdown viewer for Linux desktop.
publish_to: 'none'

version: 0.2.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_markdown: ^0.7.5
  file_picker: ^8.1.7
  window_manager: ^0.3.9
  url_launcher: ^6.3.1
  path: ^1.9.0
  shared_preferences: ^2.3.3
  markdown: ^7.2.2
  google_fonts: ^6.2.1
  desktop_drop: ^0.4.4
  scroll_to_index: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
