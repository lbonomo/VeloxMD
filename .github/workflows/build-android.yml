name: Build Android APK on release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve latest release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${GITHUB_REF_NAME:-}" ] && [ "${GITHUB_REF_NAME}" != "HEAD" ]; then
            tag="$GITHUB_REF_NAME"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            tag="${{ github.event.release.tag_name }}"
          else
            echo "Could not resolve latest release tag."
            exit 1
          fi
          if [ -z "$tag" ]; then
            echo "Could not resolve latest release tag."
            exit 1
          fi
          echo "RELEASE_TAG=$tag" >> $GITHUB_ENV

      - name: Validate release exists
        run: echo "Using release tag ${{ env.RELEASE_TAG }}"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android release APK
        run: flutter build apk --release

      - name: Build Android release AAB
        run: flutter build appbundle --release

      - name: Prepare assets
        run: |
          tag="${{ env.RELEASE_TAG }}"
          version="${tag#v}"
          mkdir -p build/android/release
          
          # Copy APK
          cp build/app/outputs/flutter-apk/app-release.apk \
            build/android/release/veloxmd-release-${tag}-universal.apk
          
          # Copy AAB
          cp build/app/outputs/bundle/release/app-release.aab \
            build/android/release/veloxmd-release-${tag}.aab
          
          echo "APK_PATH=build/android/release/veloxmd-release-${tag}-universal.apk" >> $GITHUB_ENV
          echo "AAB_PATH=build/android/release/veloxmd-release-${tag}.aab" >> $GITHUB_ENV

      - name: Install GitHub CLI
        run: |
          if ! command -v gh &> /dev/null; then
            apt-get update && apt-get install -y gh
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ env.RELEASE_TAG }}" \
            "${{ env.APK_PATH }}" \
            "${{ env.AAB_PATH }}" \
            --clobber
