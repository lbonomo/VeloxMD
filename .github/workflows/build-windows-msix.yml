name: Build Windows MSIX (Microsoft Store)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      store:
        description: "Build Store package (--store). Requires MSIX_IDENTITY_NAME and MSIX_PUBLISHER variables."
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  build-msix:
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.MSIX_IDENTITY_NAME != '' && vars.MSIX_PUBLISHER != '') }}
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Build MSIX package
        shell: pwsh
        env:
          INPUT_STORE: ${{ inputs.store }}
          IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME || 'Lucas Bonomo' }}
        run: |
          $useStore = ($env:INPUT_STORE -ne 'false') -and `
                      (-not [string]::IsNullOrWhiteSpace($env:IDENTITY_NAME)) -and `
                      (-not [string]::IsNullOrWhiteSpace($env:PUBLISHER))

          if ($useStore) {
            Write-Host "Building Microsoft Store MSIX package..."
            dart run msix:create `
              --store `
              --build-windows false `
              --identity-name "$env:IDENTITY_NAME" `
              --publisher "$env:PUBLISHER" `
              --publisher-display-name "$env:PUBLISHER_DISPLAY_NAME"
          }
          else {
            Write-Host "::warning::MSIX_IDENTITY_NAME / MSIX_PUBLISHER not set (or store=false). Building test-signed MSIX for local QA only."
            dart run msix:create --build-windows false
          }

          $msixFile = Get-ChildItem -Path "build/windows/msix" -Filter "*.msix" | Select-Object -First 1
          if (-not $msixFile) {
            throw "MSIX output not found in build/windows/msix"
          }
          Write-Host "Created MSIX: $($msixFile.FullName)"

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: veloxmd-windows-msix
          path: build/windows/msix/*.msix
          if-no-files-found: error
