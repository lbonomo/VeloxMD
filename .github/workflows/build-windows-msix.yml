name: Build Windows MSIX (Microsoft Store)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      store:
        description: "Build Microsoft Store package (--store). Disable for test-signed QA package."
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  build-msix:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Build MSIX package
        shell: pwsh
        env:
          INPUT_STORE: ${{ inputs.store }}
          IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          if ($env:INPUT_STORE -ne 'false') {
            Write-Host "Building Microsoft Store MSIX package..."
            $msixArgs = @("run", "msix:create", "--store", "--build-windows", "false")
            if (-not [string]::IsNullOrWhiteSpace($env:IDENTITY_NAME)) {
              $msixArgs += @("--identity-name", $env:IDENTITY_NAME)
            }
            if (-not [string]::IsNullOrWhiteSpace($env:PUBLISHER)) {
              $msixArgs += @("--publisher", $env:PUBLISHER)
            }
            if (-not [string]::IsNullOrWhiteSpace($env:PUBLISHER_DISPLAY_NAME)) {
              $msixArgs += @("--publisher-display-name", $env:PUBLISHER_DISPLAY_NAME)
            }
            & dart @msixArgs
          }
          else {
            Write-Host "Building test-signed MSIX for local QA..."
            dart run msix:create --build-windows false
          }

          $msixFile = Get-ChildItem -Path "build/windows/msix" -Filter "*.msix" | Select-Object -First 1
          if (-not $msixFile) {
            throw "MSIX output not found in build/windows/msix"
          }
          Write-Host "Created MSIX: $($msixFile.FullName)"

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: veloxmd-windows-msix
          path: build/windows/msix/*.msix
          if-no-files-found: error
