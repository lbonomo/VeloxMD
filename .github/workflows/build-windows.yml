name: Build Windows binary on release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build for and upload to (leave empty to use the latest release)"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve release tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if ($env:EVENT_NAME -eq "release") {
            # Triggered by a published release: use the tag from the event itself.
            $tag = $env:EVENT_TAG
          }
          elseif (-not [string]::IsNullOrWhiteSpace($env:INPUT_TAG)) {
            # Manual run with an explicit tag.
            $tag = $env:INPUT_TAG
          }
          else {
            # Manual run without a tag: fall back to the latest release.
            $tag = gh release view --json tagName --jq .tagName
          }

          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "Could not resolve a release tag."
          }

          Write-Host "Resolved release tag: $tag (event: $env:EVENT_NAME)"
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV

      - name: Validate release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${{ env.RELEASE_TAG }}"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $tag = "${{ env.RELEASE_TAG }}"
          $version = $tag.TrimStart('v')
          $assetName = "veloxmd-setup-windows-x64-$tag"
          $sourceDir = (Resolve-Path "build/windows/x64/runner/Release").Path
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $iscc)) {
            throw "ISCC not found at $iscc"
          }

          & $iscc `
            "/DMyAppVersion=$version" `
            "/DMyOutputBaseFilename=$assetName" `
            "/DMySourceDir=$sourceDir" `
            "windows/installer/veloxmd.iss"

          $assetPath = "build/windows/installer/$assetName.exe"
          if (-not (Test-Path $assetPath)) {
            throw "Installer output not found at $assetPath"
          }
          "ASSET_PATH=$assetPath" >> $env:GITHUB_ENV

      - name: Upload unsigned installer artifact for SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        id: upload-unsigned-installer
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-installer
          path: ${{ env.ASSET_PATH }}
          retention-days: 1

      - name: Sign Windows installer with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'veloxmd' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: build/windows/installer-signed

      - name: Resolve and verify signed installer
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: |
          $signedFile = Get-ChildItem -Path "build/windows/installer-signed" -Filter "*.exe" -Recurse | Select-Object -First 1
          if (-not $signedFile) {
            throw "Signed installer executable not found in build/windows/installer-signed"
          }

          $sig = Get-AuthenticodeSignature -FilePath $signedFile.FullName
          Write-Host "Authenticode status: $($sig.Status) - Signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') {
            throw "Signed installer failed Authenticode verification: $($sig.StatusMessage)"
          }

          "ASSET_PATH=$($signedFile.FullName)" >> $env:GITHUB_ENV

      - name: Warn when SignPath is not configured
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID == '' }}
        shell: pwsh
        run: |
          Write-Host "::warning::SIGNPATH_ORGANIZATION_ID is not configured. Uploading unsigned Windows installer."

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "${{ env.RELEASE_TAG }}"
          "${{ env.ASSET_PATH }}"
          --clobber
